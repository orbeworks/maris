name: Publish runtime base image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Dockerfile.runtime-base
      - docker/runtime/**
      - .github/workflows/runtime-base.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/orbeworks/maris-runtime

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime-base
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:node22-bookworm-v1
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Make the runtime image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            "/orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/maris-runtime" \
            -f visibility=public
